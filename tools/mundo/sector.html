<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sector vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #12160f;
  --panel: #181d14;
  --ink: #e4dece;
  --dim: #8f8878;
  --faint: #2c3326;
  --mark: #e2b15c;
  --bad: #d85a3a;
  --good: #8fb56a;
  --paper: #c4bfb2;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 12px/1.45 "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible { outline: 1px solid var(--mark); outline-offset: 2px; }
#app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); height: 100%; }
#map { position: relative; min-width: 0; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
#hud {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 14px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  pointer-events: none;
}
h1 {
  font-family: Fraunces, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
  font-weight: 560;
  font-size: 22px;
  line-height: 1.15;
  margin: 0;
  letter-spacing: -0.02em;
  text-wrap: balance;
  border-bottom: 1px solid var(--mark);
  width: fit-content;
}
#status, #day { color: var(--dim); margin: 4px 0 0; }
#day { font-variant-numeric: tabular-nums; text-align: right; }
#now {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 64px;
  margin: 0;
  color: var(--paper);
  pointer-events: none;
  max-width: 62ch;
}
#legend {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 12px;
  color: var(--dim);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  pointer-events: none;
}
#legend span::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 6px;
  background: var(--c);
  vertical-align: 1px;
}
aside {
  background: var(--panel);
  border-left: 1px solid var(--faint);
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 16px 16px;
}
.ctl { display: flex; flex-wrap: wrap; gap: 6px; }
.ctl button {
  background: transparent;
  border: 1px solid var(--faint);
  padding: 4px 8px;
  border-radius: 0;
}
.ctl button:hover { border-color: var(--dim); }
.ctl button[aria-pressed="true"] { border-color: var(--mark); color: var(--mark); }
#seedline, .hint, .more { color: var(--dim); margin: 0; }
h2 {
  margin: 0 0 4px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dim);
}
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; }
.nav { display: flex; flex-direction: column; gap: 6px; }
#back { align-self: flex-start; }
#back[hidden] { display: none; }
#pane { flex: 1; min-height: 0; overflow: auto; padding-right: 2px; }
#pane h2 { margin-top: 12px; }
#zoomctl {
  position: absolute;
  right: 16px;
  bottom: 12px;
  display: flex;
  gap: 6px;
  z-index: 2;
}
#zoomctl button {
  background: rgba(18, 22, 15, 0.82);
  border: 1px solid var(--faint);
  color: var(--dim);
  padding: 4px 8px;
}
#zoomctl button:hover { border-color: var(--mark); color: var(--mark); }
.tabs button, .act, #followline button {
  background: transparent;
  border: 1px solid var(--faint);
  padding: 2px 7px;
  color: var(--dim);
}
.tabs button[aria-pressed="true"], .act, #followline button { border-color: var(--mark); color: var(--mark); }
#followline { min-height: 1.2em; }
#pane button.dead { color: var(--dim); }
#pane .feedp { margin: 0 0 5px; padding-left: 8px; border-left: 2px solid var(--k, var(--faint)); }
.who {
  font-family: Fraunces, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
  font-size: 22px;
  font-weight: 560;
  letter-spacing: -0.02em;
  line-height: 1.15;
  text-wrap: balance;
  margin: 0;
}
.sub { color: var(--dim); margin: 2px 0 8px; }
.row { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.grp { margin: 0 0 8px; }
#pane button[data-k], #pane button.gh {
  display: flex;
  width: 100%;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  text-align: left;
  background: none;
  border: 0;
  padding: 1px 0;
}
#pane button[data-k] .nm, #pane button.gh .nm { text-align: right; }
.gh { font-weight: 500; }
.gh i {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 6px;
  vertical-align: 1px;
}
.role { color: var(--dim); }
.plain { margin: 2px 0; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
.d, .rumor .d { color: var(--dim); margin-right: 6px; font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--faint); margin: 1px 0 7px; }
.bar i { display: block; height: 100%; background: var(--mark); }
.bar.bad i { background: var(--bad); }
.bar.good i { background: var(--good); }
.bar.dim i { background: var(--dim); }
.rumor { margin: 4px 0; }
b[data-k] { font-weight: 500; cursor: pointer; }
b[data-k]:hover, #pane button:hover .nm { color: var(--mark); }
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}
@media (max-width: 800px) {
  body { overflow: auto; }
  #app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; }
  #map { height: 58vh; }
  aside { border-left: 0; border-top: 1px solid var(--faint); }
  #pane { max-height: 48vh; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <canvas id="cv" aria-label="Mapa del sector"></canvas>
    <div id="hud">
      <div>
        <h1 id="title">Sector</h1>
        <p id="status"></p>
      </div>
      <p id="day">día 0</p>
    </div>
    <p id="now"></p>
    <div id="zoomctl">
      <button type="button" id="zin" title="Acercar">+</button>
      <button type="button" id="zout" title="Alejar">−</button>
      <button type="button" id="zfit">encuadrar</button>
    </div>
    <div id="legend">
      <span style="--c:#e7e1d4">mercader</span>
      <span style="--c:#8eabcf">patrulla</span>
      <span style="--c:#d85a3a">pirata</span>
      <span style="--c:#b9a6e0">casco civil</span>
      <span style="--c:#d7a35a">carroñero</span>
      <span style="--c:#e2b15c">baliza</span>
      <span style="--c:#8a8474">pecio</span>
    </div>
  </div>
  <aside id="side">
    <div class="ctl">
      <button type="button" id="play" aria-pressed="true">en marcha</button>
      <button type="button" data-sp="1" aria-pressed="true">1×</button>
      <button type="button" data-sp="8">8×</button>
      <button type="button" data-sp="32">32×</button>
      <button type="button" id="reset">otro sector</button>
    </div>
    <p id="seedline"></p>
    <div class="nav">
      <button type="button" id="back" data-act="back" hidden>volver</button>
      <div class="tabs" id="lists">
        <button type="button" data-act="list" data-list="escena" aria-pressed="true">escena</button>
        <button type="button" data-act="list" data-list="imperios">imperios</button>
        <button type="button" data-act="list" data-list="ricos">ricos</button>
        <button type="button" data-act="list" data-list="fama">fama</button>
        <button type="button" data-act="list" data-list="cronica">crónica</button>
        <button type="button" data-act="list" data-list="batallas">batallas</button>
        <button type="button" data-act="list" data-list="guerras">guerras</button>
        <button type="button" data-act="list" data-list="gremios">gremios</button>
      </div>
    </div>
    <p class="hint">Día 0 al empezar. Rueda: zoom. Arrastra el mapa. Clic abre la ficha en toda la barra.</p>
    <p id="followline" class="hint"></p>
    <div id="pane"></div>
  </aside>
</div>
<p id="live" class="sr" aria-live="polite"></p>
<script>
/* Sector vivo.
   Los precios salen de la escasez. Las noticias viajan con el tráfico.
   Facciones, gremios, revueltas y cismas no están escritos: salen de personas. */
'use strict';
const GOODS = [
  { id: 'comida', base: 10 },
  { id: 'agua', base: 7 },
  { id: 'propelente', base: 16 },
  { id: 'piezas', base: 32 }
];
const NEED = [0.32, 0.22, 0.07, 0.045];
const PLANTS = {
  granja: { label: 'granja', out: 0, rate: 3.5, inp: 1, inRate: 0.55, dry: 0.38 },
  pozo: { label: 'pozo', out: 1, rate: 5.4 },
  refineria: { label: 'refinería', out: 2, rate: 3.4, inp: 1, inRate: 0.22, dry: 0.25 },
  fundicion: { label: 'fundición', out: 3, rate: 0.8 },
  astillero: { label: 'astillero', service: true, inp: 3, inRate: 0.1 }
};
const PAL = ['#d36b4f', '#d9a441', '#7ea16b', '#6f8fbf', '#c47d9a', '#8d7cc4', '#5aa8a0', '#c4b48a'];
const SY = ['ka','ro','mi','ta','vel','sa','dor','en','lu','vi','ra','no','zar','el','ti','mar','os','be','quin','ya','ge','hul','ir','ax','nes','cor','bri','hol','sen','lir','pem','vos','tal','dre','cal','mur','pio','rez','sul','teo','isa','bel','car','dio','gus','hel','jor','kin','lea','mon','nur','ol','rel','sio','tor','ul','van','yor','zal','nal','ser','vim','dal','oro','rin','sol','vea','lun'];
const HULL = ['Casco','Bruma','Óxido','Lima','Clavo','Faro','Sello','Maza','Lana','Vela','Yunque','Cieno','Sal','Cera','Traba','Nudo','Lastre','Grava'];
const MODS = [
  'un motor de remolque soldado al costado',
  'la bodega vaciada para meter gente',
  'un arpón de minero en la proa',
  'placas de un pecio remachadas al casco',
  'el soplete de una soldadora fijado a la rampa'
];
const TUNE = { split: 0.05, band: 0.02, battle: 0.07, warDeclare: 0.011, coup: 0.012, guild: 0.06, distress: 0.0032 };
const KIND = {
  guerra: '#d85a3a', pirata: '#d85a3a', rebelion: '#b9a6e0', politica: '#8eabcf',
  economia: '#8fb56a', comercio: '#e2b15c', gremio: '#e2b15c', rescate: '#e4dece',
  figura: '#e2b15c', carroña: '#d7a35a'
};
const SHIPWORD = { trade: 'mercante', patrol: 'patrulla', pirate: 'pirata', skiff: 'casco civil', escort: 'escolta', refugee: 'pasaje' };

let R = Math.random;
let S = null;

function mulberry32(a) {
  return function () {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rand() { return R(); }
function rnd(a, b) { return a + R() * (b - a); }
function irand(n) { return Math.floor(R() * n); }
function pick(a) { return a.length ? a[irand(a.length)] : null; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function key(a, b) { return a < b ? a + '-' + b : b + '-' + a; }
function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]; }); }
function strip(html) { return String(html).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim(); }
function word(n) {
  let s = '';
  for (let i = 0; i < n; i++) s += SY[irand(SY.length)];
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function uniqueName(factory) {
  for (let i = 0; i < 40; i++) {
    const n = factory();
    if (!S.names.has(n)) { S.names.add(n); return n; }
  }
  const n = factory() + ' ' + irand(90);
  S.names.add(n);
  return n;
}
function personName() { return uniqueName(function () { return word(rand() < 0.2 ? 3 : 2) + ' ' + word(2); }); }
function placeName() { return uniqueName(function () { return word(rand() < 0.35 ? 3 : 2); }); }
function hullName() { return pick(HULL) + ' ' + word(2); }

function cn(c) { return c ? '<b data-k="c" data-id="' + c.id + '">' + esc(c.name) + '</b>' : 'alguien'; }
function caePlanta(type) {
  if (!type || !PLANTS[type]) return '';
  const fem = type === 'granja' || type === 'refineria' || type === 'fundicion';
  return ' Cae ' + (fem ? 'la ' : 'el ') + PLANTS[type].label + '.';
}
function seVan(n) {
  if (n === 0) return 'No se le va ningún capitán';
  if (n === 1) return 'Se le va 1 capitán';
  return 'Se le van ' + n + ' capitanes';
}
function seQuedan(n) {
  if (n === 0) return 'no se queda nadie';
  if (n === 1) return 'se queda 1';
  return 'se quedan ' + n;
}
function pn(p) { return p ? '<b data-k="p" data-id="' + p.id + '">' + esc(p.name) + '</b>' : 'un puerto'; }
function fn(f) { return f ? '<b data-k="f" data-id="' + f.id + '" style="color:' + f.color + '">' + esc(f.name) + '</b>' : 'una bandera'; }
function gn(g) { return g ? '<b data-k="g" data-id="' + g.id + '">' + esc(g.name) + '</b>' : 'un gremio'; }

function needStock(p, g) { return p.pop * NEED[g] * 10 + 1.4; }
function price(p, g) {
  const n = needStock(p, g);
  if (!(n > 0)) return GOODS[g].base;
  return GOODS[g].base * clamp(n / (p.stock[g] + n * 0.01), 0.32, 100);
}
const AIMS = [
  { id: 'dinero', label: 'hacer fortuna' },
  { id: 'honor', label: 'guardar el honor' },
  { id: 'poder', label: 'mandar una bandera' },
  { id: 'venganza', label: 'cobrarse a alguien concreto' },
  { id: 'fama', label: 'que se diga su nombre' },
  { id: 'flota', label: 'tener naves propias' },
  { id: 'tierra', label: 'poseer un suelo' },
  { id: 'oficio', label: 'llegar a maestro de su oficio' },
  { id: 'paz', label: 'que calle la guerra' },
  { id: 'sangre', label: 'ganar combates' },
  { id: 'gremio', label: 'levantar un gremio' },
  { id: 'libertad', label: 'no deber bandera a nadie' },
  { id: 'legado', label: 'dejar gente en los puestos que abre' },
  { id: 'miedo', label: 'que le teman' },
  { id: 'refugio', label: 'sacar a la gente del peligro' },
  { id: 'mesa', label: 'poner él el precio de un bien' },
  { id: 'mapa', label: 'atraer en todos los puertos' },
  { id: 'lealtad', label: 'no soltar su bandera' },
  { id: 'trono', label: 'quedarse un mundo' },
  { id: 'vida', label: 'seguir vivo' }
];
function aimLabel(id) {
  for (const a of AIMS) if (a.id === id) return a.label;
  return 'salir adelante';
}
function craftOf(c, k) {
  if (!c || !c.craft) return 0.05;
  return c.craft[k] || 0;
}
function practice(c, k, amt) {
  if (!c || !c.alive) return;
  if (!c.craft) c.craft = { trato: 0.05, combate: 0.05, piloto: 0.05, mando: 0.05 };
  const cur = c.craft[k] || 0;
  c.craft[k] = Math.min(1, cur + amt * (1 - cur) * (1 - cur));
}
function haggle(c) { return 1 + 0.4 * craftOf(c, 'trato'); }
function aimProgress(c) {
  if (!c) return 0;
  const ships = S.ships.filter(function (s) { return s.alive && (s.owner === c.id || s.cap === c.id); }).length;
  const seen = c.seen ? Object.keys(c.seen).length : 0;
  const ports = S.P.length || 1;
  switch (c.aim) {
    case 'dinero': return clamp(c.wealth / 2500, 0, 1);
    case 'honor': return clamp(c.saves * 0.22 + c.fame * 0.08 + (c.flags.fled ? 0 : 0.15), 0, 1);
    case 'poder': return (c.role === 'líder' || c.role === 'caudillo') ? 1 : clamp(c.fame / 5, 0, 0.75);
    case 'venganza': return c.flags.avenged ? 1 : (c.flags.vendetta != null ? 0.15 : 0);
    case 'fama': return clamp(c.fame / 6, 0, 1);
    case 'flota': return clamp(ships / 4, 0, 1);
    case 'tierra': return clamp((c.flags.plants || 0) / 2, 0, 1);
    case 'oficio': return Math.max(craftOf(c, 'trato'), craftOf(c, 'combate'), craftOf(c, 'piloto'), craftOf(c, 'mando'));
    case 'paz': return c.faction != null && S.F[c.faction] && S.F[c.faction].alive && !S.F[c.faction].wars.size ? clamp(0.3 + c.fame * 0.1, 0, 1) : 0.1;
    case 'sangre': return clamp((c.kills || 0) / 4, 0, 1);
    case 'gremio': return c.role === 'maestre' ? 1 : (c.guild != null ? 0.45 : 0);
    case 'libertad': return c.faction == null && c.role !== 'pirata' ? clamp(0.4 + c.wealth / 2000, 0, 1) : 0.15;
    case 'legado': return clamp((c.flags.hired || 0) / 3, 0, 1);
    case 'miedo': return clamp((c.fame * 0.1) + (c.kills || 0) * 0.2, 0, 1);
    case 'refugio': return clamp((c.saves || 0) / 4, 0, 1);
    case 'mesa': return clamp((c.flags.plants || 0) / 2 + c.wealth / 4000, 0, 1);
    case 'mapa': return clamp(seen / ports, 0, 1);
    case 'lealtad': return c.faction != null ? clamp(0.25 + c.loy * 0.5 + c.fame * 0.05, 0, 1) : 0.05;
    case 'trono': return (c.role === 'líder' || c.role === 'caudillo' || c.role === 'gobernador') ? clamp(0.55 + c.fame * 0.08, 0, 1) : clamp(c.fame / 8, 0, 0.4);
    case 'vida': return c.alive ? clamp(0.35 + (1 - (c.fear || 0)) * 0.4 + (S.day > 30 ? 0.2 : S.day / 150), 0, 1) : 0;
    default: return 0;
  }
}
function bar(label, v, kind) {
  const p = Math.round(clamp(v, 0, 1) * 100);
  return '<div class="row"><span>' + esc(label) + '</span><span>' + p + '%</span></div><div class="bar ' + (kind || '') + '"><i style="width:' + p + '%"></i></div>';
}
function hurt(s, dmg, by) {
  if (!s || !s.alive) return false;
  if (s.hull == null) s.hull = 1;
  const cap = S.C[s.cap];
  s.hull = Math.max(0, s.hull - dmg * (1 - craftOf(cap, 'mando') * 0.25));
  if (cap && cap.alive) {
    practice(cap, 'combate', 0.008);
    cap.fear = Math.min(1, (cap.fear || 0) + dmg * 0.4);
  }
  for (const o of S.ships) {
    if (!o.alive || o.id === s.id || dist(o, s) > 0.12) continue;
    const oc = S.C[o.cap];
    if (oc && oc.alive) oc.fear = Math.min(1, (oc.fear || 0) + 0.04);
  }
  if (s.hull > 0) return false;
  s.alive = false;
  s.doomed = true;
  addWreck(s.x, s.y, rnd(2, 5), s.name, null);
  if (cap && cap.alive) {
    const cling = (cap.life || 0.5) > 0.55 && (cap.aim === 'vida' || (cap.fear || 0) > 0.45);
    if (cling && rand() < (cap.life || 0.5)) {
      cap.fear = Math.min(1, (cap.fear || 0) + 0.22);
      if (!cap.marks) cap.marks = [];
      cap.marks.unshift({ day: Math.floor(S.day), text: 'Pierde ' + s.name + ' y sale con vida. Desde entonces mira el casco antes que el encargo.' });
      if (cap.marks.length > 6) cap.marks.pop();
      if (cap.role !== 'líder' && cap.role !== 'caudillo' && cap.role !== 'jefe') cap.role = 'náufrago';
    } else killChar(cap, by || null);
  }
  return true;
}
function facAlive(id) {
  const f = id == null ? null : S.F[id];
  return f && f.alive ? f : null;
}
function leader(f) {
  if (!f) return null;
  const c = S.C[f.leader];
  return c && c.alive ? c : null;
}
function styleOf(l) {
  if (!l) return { trade: 0.5, repress: 0.3, war: 0.4 };
  return {
    trade: clamp(l.greed * 0.35 + (1 - l.cru) * 0.55, 0, 1),
    repress: l.cru,
    war: clamp(l.amb * 0.55 + l.cru * 0.45, 0, 1)
  };
}
function style(f) {
  const l = f ? S.C[f.leader] : null;
  return styleOf(l);
}
function motto(l) {
  if (!l) return 'Aquí se atraca si se paga.';

function lineHits(x0, y0, x1, y1, threats) {

    const t = i / n;
    const x = x0 + (x1 - x0) * t;
    const y = y0 + (y1 - y0) * t;

function routeAround(x0, y0, x1, y1, threats) {

  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 0.001;
  const px = -dy / len, py = dx / len;
  let best = null, bd = 1e9;

    const h = consider[i];

function runPlant(p, pl) {
  const t = PLANTS[pl.type];
  if (!t || pl.hp < 1) return;
  let scale = 1;
  if (t.inp != null) {
    const use = Math.min(t.inRate, p.stock[t.inp]);
    p.stock[t.inp] -= use;
    const full = t.inRate <= 0 ? 1 : use / t.inRate;
    scale = t.dry != null ? t.dry + (1 - t.dry) * full : full;
  }
  if (t.service) {
    if (scale > 0.35) payPlant(p, pl, 7 * scale);
    return;
  }
  const hands = 0.65 + p.pop * 0.32;
  const out = t.rate * scale * hands;
  p.stock[t.out] += out;
  payPlant(p, pl, out * price(p, t.out) * 0.14);
}
function payPlant(p, pl, inc) {

    for (let g = 0; g < 4; g++) {

function spread() {
  for (const n of S.news) {
    if (S.day - n.day > 46) continue;
    const know = Array.from(n.know);
    for (const pid of know) {
      const a = S.P[pid];
      if (!a) continue;
      for (const b of S.P) {
        if (n.know.has(b.id)) continue;
        let reach = (a.relay || b.relay) ? 0.4 : 0.24;
        if ((S.traffic[key(a.id, b.id)] || 0) > 12) reach = Math.max(reach, 0.62);
        if (dist(a, b) <= reach) n.know.add(b.id);
      }
    }
    for (const pid of Array.from(n.know)) {
      if (n.told.has(pid)) continue;
      n.told.add(pid);
      if (n.route && n.risk) addRisk(pid, n.route, n.risk);
      if (n.routes) for (const r of n.routes) addRisk(pid, r.k, r.amt);
      if (n.quote && S.P[pid]) S.P[pid].quote[n.quote.k] = n.quote.v;
      if (n.html) hear(pid, n.html);
    }
  }
  if (S.news.length > 120) S.news.splice(0, S.news.length - 120);
  for (const p of S.P) {
    for (const k in p.risk) {
      p.risk[k] *= 0.982;
      if (p.risk[k] < 0.02) delete p.risk[k];
    }
  }
  for (const k in S.traffic) {
    S.traffic[k] *= 0.9;
    if (S.traffic[k] < 1) delete S.traffic[k];
  }
  for (const k in S.watch) {
    S.watch[k] *= 0.88;
    if (S.watch[k] < 0.05) delete S.watch[k];
  }
}

function succession(f, why) {

function buyPlant(c, guild) {

  if (el._html === html) return true;
  const top = el.scrollTop;
  el._html = html;
  el.innerHTML = html;
  el.scrollTop = top;
  return false;
}
function dossier(v) {
  if (v.t === 'p' && S.P[v.id]) return cardPlace(S.P[v.id]);
  if (v.t === 'c' && S.C[v.id]) return cardChar(S.C[v.id]);
  if (v.t === 'f' && S.F[v.id]) return cardFac(S.F[v.id]);
  if (v.t === 'g' && S.G[v.id]) return cardGuild(S.G[v.id]);
  if (v.t === 'b' && S.B[v.id]) return cardBand(S.B[v.id]);
  if (v.t === 'battle' && S.battles[v.id]) return cardBattle(S.battles[v.id]);
  if (v.t === 'war') {
    const w = (S.wars || []).find(function (x) { return x.id === v.id; });
    return w ? cardWar(w) : '<p class="hint">Esa guerra ya no está en el libro.</p>';
  }
  if (v.t === 'w') {
    const w = S.wrecks.find(function (x) { return x.id === v.id; });
    return w ? cardWreck(w) : '<p class="hint">Ese pecio ya no está.</p>';
  }
  return '<p class="hint">Ya no está.</p>';
}
function goList(name) {
  S.stack = [];
  S.list = name;
  S.view = { t: 'list', list: name };
  S.sel = null;
  const el = $('pane');
  if (el) el._html = null;
  renderPane();
}
function goEntity(t, id) {
  if (!S.view) S.view = { t: 'list', list: 'escena' };
  if (S.view.t === t && S.view.id === id) {
    renderPane();
    return;
  }
  S.stack.push(S.view);
  if (S.stack.length > 16) S.stack.shift();
  S.view = { t: t, id: id };
  S.sel = { t: t, id: id };
  const el = $('pane');
  if (el) { el._html = null; el.scrollTop = 0; }
  renderPane();
}
function goBack() {
  const prev = S.stack.pop();
  S.view = prev || { t: 'list', list: S.list || 'escena' };
  S.sel = S.view.t === 'list' ? null : { t: S.view.t, id: S.view.id };
  const el = $('pane');
  if (el) { el._html = null; el.scrollTop = 0; }
  renderPane();
}
function renderPane() {
  const el = $('pane');
  if (!el || !S || !S.view) return;
  const v = S.view;
  document.querySelectorAll('#lists [data-list]').forEach(function (b) {
    const on = v.t === 'list' && b.dataset.list === v.list;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const back = $('back');
  if (back) back.hidden = !(S.stack && S.stack.length);
  let html = '';
  if (v.t === 'list') {
    if (v.list === 'imperios') html = '<h2>Imperios</h2>' + listEmpires();
    else if (v.list === 'ricos') html = '<h2>Los más ricos</h2>' + listPeople('wealth');
    else if (v.list === 'fama') html = '<h2>Influyentes</h2>' + listPeople('fame');
    else if (v.list === 'cronica') html = '<h2>Crónica</h2>' + chronoOf(function () { return true; }, 80);
    else if (v.list === 'batallas') html = '<h2>Batallas</h2>' + listBattles();
    else if (v.list === 'guerras') html = '<h2>Guerras</h2>' + listWars();
    else if (v.list === 'gremios') html = '<h2>Gremios</h2>' + listGuilds();
    else html = '<h2>En escena</h2>' + sceneList();
  } else html = dossier(v);
  samePaint(el, html);
}
function renderCard() { renderPane(); }
function listEmpires() {
  let html = '';
  const alive = S.F.filter(function (f) { return f.alive; });
  const dead = S.F.filter(function (f) { return !f.alive; });
  for (const f of alive) {
    const l = S.C[f.leader];
    const n = S.P.filter(function (p) { return p.fac === f.id; }).length;
    html += '<div class="grp"><button type="button" class="gh" data-k="f" data-id="' + f.id + '"><i style="background:' + f.color + '"></i>' + esc(f.name) + '</button>';
    html += '<button type="button" data-k="f" data-id="' + f.id + '"><span class="role">' + n + (n === 1 ? ' puerto' : ' puertos') + ' · ' + money(f.treasury) + '</span><span class="nm">' + (l ? esc(l.name) : 'sin líder') + '</span></button>';
    html += '<p class="sub">' + esc(f.origin || '') + '</p></div>';
  }
  if (dead.length) {
    html += '<p class="plain">Disueltos</p>';
    for (let i = dead.length - 1; i >= 0; i--) {
      const f = dead[i];
      html += '<button type="button" class="dead" data-k="f" data-id="' + f.id + '"><span class="role">día ' + f.born + '</span><span class="nm">† ' + esc(f.name) + '</span></button>';
    }
  }
  return html || '<p class="hint">Todavía no hay banderas.</p>';
}
function listPeople(mode) {
  const rows = S.C.filter(function (c) { return c.alive; }).sort(function (a, b) {
    return mode === 'fame' ? (b.fame - a.fame) || (b.wealth - a.wealth) : (b.wealth - a.wealth) || (b.fame - a.fame);
  }).slice(0, 18);
  if (!rows.length) return '<p class="hint">Nadie con nombre todavía.</p>';
  return rows.map(function (c) {
    const home = S.P[c.home];
    const mark = S.follow === c.id ? ' · sigues' : '';
    const right = mode === 'fame' ? ('fama ' + c.fame.toFixed(1)) : (Math.round(c.wealth) + ' cr');
    return '<button type="button" data-k="c" data-id="' + c.id + '"><span class="role">' + esc(c.role || 'sin cargo') + (home ? ' · ' + esc(home.name) : '') + mark + '</span><span class="nm">' + esc(c.name) + ' · ' + right + '</span></button>';
  }).join('');
}
function sceneList() {
  const shown = new Set();
  let html = '';
  for (const f of S.F) {
    if (!f.alive) continue;
    const people = roster(f);
    html += '<div class="grp"><button type="button" class="gh" data-k="f" data-id="' + f.id + '"><i style="background:' + f.color + '"></i>' + esc(f.name) + '</button>';
    for (const c of people.slice(0, 6)) {
      shown.add(c.id);
      html += '<button type="button" data-k="c" data-id="' + c.id + '"><span class="role">' + esc(c.role || '') + '</span><span class="nm">' + esc(c.name) + '</span></button>';
    }
    if (people.length > 6) html += '<p class="more">' + (people.length - 6) + ' más en la ficha</p>';
    html += '</div>';
  }
  for (const g of S.G) {
    if (!g.alive) continue;
    const m = S.C[g.master];
    html += '<div class="grp"><button type="button" class="gh" data-k="g" data-id="' + g.id + '"><i style="background:#e2b15c"></i>' + esc(g.name) + '</button>';
    if (m) { shown.add(m.id); html += '<button type="button" data-k="c" data-id="' + m.id + '"><span class="role">maestre</span><span class="nm">' + esc(m.name) + '</span></button>'; }
    html += '<p class="more">' + g.members.size + ' en el colegio</p></div>';
  }
  for (const b of S.B) {
    if (!b.alive) continue;
    const sp = S.C[b.speaker];
    const n = S.ships.filter(function (s) { return s.alive && s.band === b.id; }).length;
    html += '<div class="grp"><button type="button" class="gh" data-k="b" data-id="' + b.id + '"><i style="background:#b9a6e0"></i>' + esc(b.name) + '</button>';
    if (sp) { shown.add(sp.id); html += '<button type="button" data-k="c" data-id="' + sp.id + '"><span class="role">cabecilla</span><span class="nm">' + esc(sp.name) + '</span></button>'; }
    html += '<p class="more">' + n + ' cascos modificados</p></div>';
  }
  const chiefs = S.bases.filter(function (b) { return b.alive; });
  if (chiefs.length) {
    html += '<div class="grp"><p class="plain">Piratas</p>';
    for (const b of chiefs) {
      const c = S.C[b.chief];
      if (!c) continue;
      shown.add(c.id);
      html += '<button type="button" data-k="c" data-id="' + c.id + '"><span class="role">' + esc(b.name) + '</span><span class="nm">' + esc(c.name) + '</span></button>';
    }
    html += '</div>';
  }
  const merchants = S.C.filter(function (c) {
    return c.alive && !shown.has(c.id) && S.ships.some(function (s) { return s.alive && s.cap === c.id && (s.kind === 'trade' || s.kind === 'refugee'); });
  }).sort(function (a, b) { return b.wealth - a.wealth; }).slice(0, 5);
  if (merchants.length) {
    html += '<div class="grp"><p class="plain">Mercaderes</p>';
    for (const c of merchants) {
      html += '<button type="button" data-k="c" data-id="' + c.id + '"><span class="role">' + Math.round(c.wealth) + ' cr</span><span class="nm">' + esc(c.name) + '</span></button>';
    }
    html += '</div>';
  }
  return html || '<p class="hint">Nadie con nombre todavía.</p>';
}
function renderFeed() {
  if (!S.feedDirty) return;
  S.feedDirty = false;
  if (S.view && S.view.t === 'list' && S.view.list === 'cronica') {
    const pane = $('pane');
    if (pane) pane._html = null;
    renderPane();
  }
  const live = $('live');
  if (live && S.feed[0]) live.textContent = 'Día ' + S.feed[0].day + '. ' + S.feed[0].plain;
  const now = $('now');
  if (now && S.feed[0]) now.textContent = S.feed[0].plain;
}
function statusLine() {
  const fac = S.F.filter(function (f) { return f.alive; }).length;
  const g = S.G.filter(function (x) { return x.alive; }).length;
  const b = S.B.filter(function (x) { return x.alive; }).length;
  const seen = new Set();
  let wars = 0;
  for (const f of S.F) if (f.alive) for (const id of f.wars.keys()) {
    const k = key(f.id, id);
    if (!seen.has(k)) { seen.add(k); wars++; }
  }
  const bits = [S.P.length + ' puertos', fac + (fac === 1 ? ' bandera' : ' banderas')];
  if (g) bits.push(g + (g === 1 ? ' gremio' : ' gremios'));
  if (b) bits.push(b + (b === 1 ? ' revuelta' : ' revueltas'));
  if (wars) bits.push(wars + (wars === 1 ? ' guerra' : ' guerras'));
  return bits.join(' · ');
}
function renderHud() {
  const title = $('title');
  if (!title) return;
  title.textContent = S.name;
  $('day').textContent = 'día ' + Math.floor(S.day);
  $('status').textContent = statusLine();
  $('seedline').textContent = 'semilla ' + S.seed;
  document.title = S.name;
  const fl = $('followline');
  if (fl) {
    const c = S.follow != null ? S.C[S.follow] : null;
    let html = '';
    if (c && c.alive) html = 'Sigues a ' + esc(c.name) + ' <button type="button" data-act="unfollow">dejar</button>';
    else if (S.follow != null) S.follow = null;
    if (fl._html !== html) { fl._html = html; fl.innerHTML = html; }
  }
}
function focusStart() {
  S.stack = [];
  S.list = 'escena';
  S.view = { t: 'list', list: 'escena' };
  S.sel = null;
}

let speed = 1, running = true, last = 0, uiT = 0;
function readSeed() {
  try {
    const q = new URLSearchParams(location.search).get('semilla');
    if (q && /^\d+$/.test(q)) return Number(q) >>> 0;
  } catch (e) { /* sin URL */ }
  return (Math.random() * 0x7fffffff) >>> 0;
}
function writeSeed(seed) {
  try {
    const u = new URL(location.href);
    u.searchParams.set('semilla', String(seed));
    history.replaceState(null, '', u.pathname + u.search);
  } catch (e) { /* file:// a veces no deja */ }
}
function bootWorld(seed) {
  init(seed || 1);
  focusStart();
  if (typeof document !== 'undefined') {
    writeSeed(S.seed);
    ['pane', 'followline'].forEach(function (id) {
      const el = $(id);
      if (el) el._html = null;
    });
    camZ = 1; camX = 0.5; camY = 0.5;
    resize();
    renderHud();
    renderPane();
    S.feedDirty = true;
    renderFeed();
  }
}
function frame(now) {
  if (!last) last = now;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running && S) {
    let left = dt * 0.55 * speed;
    let guard = 0;
    while (left > 0.0001 && guard++ < 40) {
      const h = Math.min(0.2, left);
      step(h);
      left -= h;
    }
  }
  if (S) {
    renderHud();
    draw();
    uiT += dt;
    if (uiT > 0.4) {
      uiT = 0;
      renderFeed();
      renderPane();
    }
  }
  requestAnimationFrame(frame);
}
function boot() {
  try { REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { REDUCE = false; }
  const cv = $('cv');
  try { bootWorld(readSeed()); }
  catch (err) {
    const el = $('pane');
    if (el) el.textContent = 'La simulación se detuvo: ' + (err && err.message ? err.message : err);
    throw err;
  }
  $('play').addEventListener('click', function () {
    running = !running;
    $('play').setAttribute('aria-pressed', running ? 'true' : 'false');
    $('play').textContent = running ? 'en marcha' : 'pausa';
  });
  document.querySelectorAll('[data-sp]').forEach(function (b) {
    b.addEventListener('click', function () {
      speed = +b.dataset.sp;
      document.querySelectorAll('[data-sp]').forEach(function (x) {
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
    });
  });
  $('reset').addEventListener('click', function () {
    try { bootWorld((Math.random() * 0x7fffffff) >>> 0); }
    catch (err) {
      $('pane').textContent = 'La simulación se detuvo: ' + err.message;
    }
  });
  $('side').addEventListener('click', function (e) {
    const act = e.target.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'follow') {
        S.follow = +act.dataset.id;
        goEntity('c', S.follow);
      } else if (act.dataset.act === 'unfollow') S.follow = null;
      else if (act.dataset.act === 'back') goBack();
      else if (act.dataset.act === 'list') goList(act.dataset.list);
      renderHud();
      renderPane();
      return;
    }
    const t = e.target.closest('[data-k]');
    if (!t) return;
    goEntity(t.dataset.k, +t.dataset.id);
  });
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, camZ * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
  }, { passive: false });
  let drag = null;
  cv.addEventListener('pointerdown', function (e) {
    drag = { x: e.clientX, y: e.clientY, mx: MX, my: MY, moved: false };
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 5) drag.moved = true;
    if (!drag.moved) return;
    MX = drag.mx + dx;
    MY = drag.my + dy;
    camX = (W / 2 - MX) / MS;
    camY = (H / 2 - MY) / (MS / 1.2);
  });
  cv.addEventListener('pointerup', function () {
    if (drag && drag.moved) skipClick = true;
    drag = null;
  });
  $('zin').addEventListener('click', function () { zoomAt(W / 2, H / 2, camZ * 1.25); });
  $('zout').addEventListener('click', function () { zoomAt(W / 2, H / 2, camZ / 1.25); });
  $('zfit').addEventListener('click', function () {
    camZ = 1; camX = 0.5; camY = 0.5;
    layoutCam();
  });
  cv.addEventListener('click', function (e) {
    if (skipClick) { skipClick = false; return; }
    const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = null, bd = 18;
    for (const s of S.ships) {
      if (!s.alive || s.cap == null) continue;
      const d = Math.hypot(X(s.x) - mx, Y(s.y) - my);
      if (d < 8 && d < bd) { bd = d; best = { t: 'c', id: s.cap }; }
    }
    for (const b of S.bases) {
      if (!b.alive) continue;
      const d = Math.hypot(X(b.x) - mx, Y(b.y) - my);
      if (d < 10 && d < bd) { bd = d; best = { t: 'c', id: b.chief }; }
    }
    for (const w of S.wrecks) {
      const d = Math.hypot(X(w.x) - mx, Y(w.y) - my);
      if (d < 8 && d < bd) {
        bd = d;
        best = w.battle != null ? { t: 'battle', id: w.battle } : { t: 'w', id: w.id };
      }
    }
    for (const p of S.P) {
      const d = Math.hypot(X(p.x) - mx, Y(p.y) - my);
      if (d < radius(p) + 10 && d < bd + 6) { bd = d; best = { t: 'p', id: p.id }; }
    }
    if (best) goEntity(best.t, best.id);
  });
  addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      $('play').click();
    }
  });
  addEventListener('resize', resize);
  addEventListener('error', function (e) {
    const el = $('pane');
    if (el && e.message) el.textContent = 'La simulación se detuvo: ' + e.message;
  });
  requestAnimationFrame(frame);
}

globalThis.SectorSim = { init: init, step: step, warm: warm, report: report, bootWorld: bootWorld, get S() { return S; } };
if (typeof document !== 'undefined') boot();
</script>
