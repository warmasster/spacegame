[workspace]
members = ["crates/core", "crates/render", "crates/app", "crates/signals", "crates/controls", "crates/machines", "crates/ship", "crates/editor", "crates/audio", "crates/launcher", "crates/net", "crates/server", "crates/play"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
publish = false

# Verified on 2026-09-30; activated by the milestone that first uses each crate.
# H0's numerical reference is deliberately std-only and works offline.
[workspace.dependencies]
glam = "=0.33.11"
wgpu = { version = "=30.0.1", default-features = false }
winit = "=0.30.13"
bytemuck = "=1.25.2"
rayon = "=1.12.0"
egui = "=0.36.2"
egui-wgpu = { version = "=0.36.2", default-features = false }
egui-winit = { version = "=0.36.2", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "KHR_materials_emissive_strength"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"


# Tests run the real ship (routing, voxels, air): optimised enough to take seconds, not minutes;
# the dependencies fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
